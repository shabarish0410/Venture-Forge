name: Foundation checks
on: [push, pull_request]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python scripts/setup_local.py
      - run: docker compose up -d --wait
      - run: pip install -r requirements.lock -e .
      - run: python -m alembic upgrade head
      - run: python -m pytest
      - run: npm ci
      - run: python scripts/export_contracts.py && npm run contracts
      - run: git diff --exit-code -- docs/openapi.json apps/web/lib/contracts.ts
      - run: npm run typecheck && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - if: always()
        run: docker compose down
